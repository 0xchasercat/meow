[package]
name = "meow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "meow"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# === CFG-001 === intra-workspace: the CLI dispatches `meow sync` to the config library.
meow-config = { path = "../config" }
# === UI-001 === shared structural-cuteness engine for meow-owned diagnostics.
meow-ui = { path = "../ui" }
# === /UI-001 ===
# === /CFG-001 ===
# === RT-001 === `meow run` drives one ESM module to completion through V8.
meow-runtime = { path = "../runtime" }
# Current-thread runtime to drive the (async) module run on the binary edge.
tokio = { workspace = true }
# === /RT-001 ===
# === LOAD-001 ===
# `meow run` installs the real resolver + content-addressed cache loader. The
# binary edge translates the lockfile into the resolver's name->hash map and
# resolves the host home for the cache (I-6: ambient reads live at the edge only).
meow-loader = { path = "../loader" }
meow-pkg = { path = "../pkg" }
meow-graph = { path = "../graph" }
meow-tool = { path = "../tool" }

# Typed, causal edge errors (lockfile ambiguity surfaced honestly to `meow run`).
thiserror = { workspace = true }
# === PKG-002 ===
semver = { workspace = true }
reqwest = { workspace = true }
# === /PKG-002 ===
# === /LOAD-001 ===
# === OBS-001 ===
# `meow why-dep` reuses the pure lockfile path-tracer; serde_json renders --json.
meow-obs = { path = "../obs" }
serde_json = { workspace = true }
# === /OBS-001 ===

# === ADR-5 === parse tsc diagnostic output for meow-ui rendering
regex = { workspace = true }
# === /ADR-5 ===

deno_error = { workspace = true }
# === WORKER-001 === the cooperative-isolate node:worker_threads OPS now live in
# `meow_runtime::worker` (so they bake into the V8 snapshot). The CLI is only the
# host edge: it implements `meow_runtime::worker::WorkerSpawner` and drives the
# worker isolates. It needs NO direct deno_core dep — V8 types flow through the
# `meow_runtime` re-exports (I-10 single-edge invariant); deno_core remains a
# build-dep below for snapshot baking.
deno_node = { workspace = true }
deno_permissions = { workspace = true }
deno_semver = { workspace = true }
node_resolver = { workspace = true }

[build-dependencies]
# Snapshot + residual lazy sources are baked at build time by build.rs. These
# mirror the runtime's deno_* deps so the snapshot's extension/feature layout
# matches the runtime that consumes it.
deno_napi = { workspace = true }
meow-runtime = { path = "../runtime" }
meow-pkg = { path = "../pkg" }
meow-loader = { path = "../loader" }
deno_node = { workspace = true }
deno_core = { workspace = true }
deno_webidl = { workspace = true }
deno_web = { workspace = true }
deno_crypto = { workspace = true }
deno_fetch = { workspace = true }
deno_net = { workspace = true }
[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
# === LOAD-003 === build npm-style gzip-tar archives in the `meow run` e2e tests so
# the cache holds real package tarballs (LOAD-003 resolves archives, not raw bytes).
tar = { workspace = true }
flate2 = { workspace = true }
# === /LOAD-003 ===
