[package]
name = "meow-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The ONE V8 edge in the workspace (I-10, ADR-1): unmodified upstream deno_core,
# pinned in [workspace.dependencies] by DIST-001. No direct `v8` dep — use
# `deno_core::v8` (re-exported here as `meow_runtime::v8`).
deno_core = { workspace = true }
thiserror = { workspace = true }
# === UI-001 === shared structural-cuteness renderer for `meow:ui`.
meow-ui = { path = "../ui" }
# === /UI-001 ===
# === RT-002 ===
# Async host I/O (ADR-9): tokio/mio is the committed portable layer. Consumed by
# the `io` ops (tokio::fs / tokio::net) + driven on the current-thread runtime.
tokio = { workspace = true }
# Typed op errors that surface as JS exceptions (not panics): deno_core's op2
# requires the error type to impl `deno_error::JsErrorClass`; deno_core does not
# re-export it, so it is a direct dep pinned to the exact version deno_core uses.
deno_error = { workspace = true }
# === /RT-002 ===
# === RT-004 ===
# strict-web Stateless-Edge globals (CANON §8.1): unmodified upstream Deno web
# extensions, co-versioned with deno_core 0.403 (pins owned by DIST-001). URL,
# URLPattern and console live in deno_web at this generation; deno_url/deno_console
# are kept as deprecated compatibility pins for Deno's Node dependency graph. The
# heavy `fetch` HTTP client (hyper/rustls + Request/Response/Headers/FormData) is
# isolated behind the default-on `web-fetch` feature so the footprint contingency
# (I-10) can drop it without losing the light globals.
deno_webidl = { workspace = true }
deno_web = { workspace = true }
deno_crypto = { workspace = true }
deno_fetch = { workspace = true, optional = true }
deno_net = { workspace = true, optional = true }
deno_permissions = { workspace = true }
# === RT-007 === Deno-owned Node/CommonJS/N-API bridge.
deno_node = { workspace = true }
deno_node_crypto = { workspace = true }
deno_napi = { workspace = true }
deno_fs = { workspace = true }
deno_url = { workspace = true }
deno_console = { workspace = true }
deno_io = { workspace = true }
deno_telemetry = { workspace = true }
node_resolver = { workspace = true }
deno_package_json = { workspace = true }
deno_semver = { workspace = true }
sys_traits = { workspace = true }
deno_os = { workspace = true }
deno_process = { workspace = true }
deno_ast = { version = "0.53.2", features = ["transpiling", "type_strip"] }
# === /RT-007 ===
# PKG-002's `meow install` HTTPS client (`reqwest`) and runtime TLS both use
# `rustls`; installing the aws-lc-rs default in runtime avoids provider ambiguity.
rustls = { workspace = true, optional = true }
# === RT-005 ===
# `meow:http` reuses the same Hyper generation already in the tree: hyper itself,
# the body adapters, and the existing hyper-util pin extended with server/tokio
# features. `serde` drives the op2 `#[serde]` request/handle structs only.
serde = { workspace = true, features = ["derive"] }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "service", "tokio"] }
http-body-util = { workspace = true }
# === /RT-005 ===
# === /RT-004 ===
# === RT-006 ===
# Determinism harness (I-6): seeded ChaCha20 (reproducible RNG) + the OS entropy
# grant. Used ONLY in src/hermetic/state.rs (the one sanctioned host seam).
rand_chacha = { workspace = true }
rand_core = { workspace = true }
getrandom = { workspace = true }
# === /RT-006 ===

[dev-dependencies]
# Tests drive the async run path on a current-thread runtime (A5); deno_core also
# requires an active tokio context at isolate creation.
tokio = { workspace = true }
# The test-only echo op (T2) + capture extensions use the `op2`/`extension!`
# macros, which emit absolute `::deno_core` paths — so the test target needs the
# crate in scope. The edge still originates ONLY from crates/runtime (the sole
# embedding owner; I-10), never from another workspace crate.
deno_core = { workspace = true }
# === RT-004 ===
# The `web_fetch_denied` test installs a Send+Sync recording capability check; a
# lock without poisoning is the right tool (parking_lot, per the workspace rule).
parking_lot = "0.12"
# === /RT-005 ===
meow-config = { path = "../config" }
meow-graph = { path = "../graph" }
meow-loader = { path = "../loader" }
meow-pkg = { path = "../pkg" }
# === /RT-005 ===

# === RT-004 ===
[features]
default = ["web-fetch"]
# `web-fetch` pulls deno_fetch (hyper/rustls/aws-lc) for the WHATWG `fetch`,
# `Request`/`Response`/`Headers`/`FormData` globals and the capability-gated
# network seam. Default-on; the footprint gate may turn it off (RT-004a) if the
# HTTP client tree blows the I-10 budget, shipping the lighter globals alone.
web-fetch = ["dep:deno_fetch", "dep:deno_net", "dep:rustls"]
# === /RT-004 ===
