[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meow-rs/meow"
version = "0.0.0"

# Externals are DECLARED centrally so consuming crates inherit one pin each.
# A pin here costs nothing until a crate lists it under its own [dependencies];
# this skeleton consumes ONLY clap (+ dev assert_cmd/predicates), so cargo builds
# nothing heavy. Each later spec that introduces an external appends its pin under
# its own `# === <SPEC-ID> ===` marker (keeps fence-balance meaningful, makes the
# footprint audit a single read).
[workspace.dependencies]
# === DIST-001 ===
# V8 — unmodified upstream `deno_core` (re-exports `v8`), never forked (I-10, CANON §26.2, ADR-1).
# Pin confirmed by RT-001's V8 build; consumed by RT-* (use `deno_core::v8`, no direct v8 dep).
deno_core = "0.403"
# Parse/semantic/transform — Oxc, pinned as sub-crates in the GRAPH-001 fence below (I-1).
# Bundler — declared when TOOL-003 (P3) lands:
# rolldown = "..."
# Async I/O — consumed by RT-002 (tokio; io_uring on Linux).
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "net", "macros"] }
# === RT-002 ===
# Typed op errors that cross into JS as exceptions (deno_core's op2 requires the
# error type to impl `deno_error::JsErrorClass`). Pinned `=` to the exact version
# deno_core 0.403 depends on so the trait/impls unify (deno_core does not re-export it).
deno_error = "=0.7.1"
# === /RT-002 ===
# === LOAD-003 ===
# Package archives + manifests. Serde stays shared here because CFG/PKG/LOAD all consume it.
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
# === /LOAD-003 ===
# CLI — consumed HERE.
clap = { version = "4", features = ["derive"] }
# Errors — typed + causal (CRAFT): thiserror for libraries, anyhow for the binary edge.
thiserror = "2"
anyhow = "1"
# Dev-only (integration tests of the binary).
assert_cmd = "2"
predicates = "3"
# === /DIST-001 ===
# === PKG-001 ===
# Content hashing for the cache + lockfile SRI (sha256-<base64>). Consumed by PKG (and later LOAD/SEC).
sha2 = "0.10"
base64 = "0.22"
semver = "1"
# === /PKG-001 ===
# === GRAPH-001 ===
# The ONE parser (I-1, P15): Oxc sub-crates pinned together at one generation. The
# umbrella `oxc` (DIST-001) is left declared-but-unused — sub-crates give per-feature
# control and avoid a duplicate `oxc` key here. Consumed ONLY by crates/graph.
oxc_allocator = "0.134"
oxc_ast = "0.134"
oxc_parser = "0.134"
oxc_semantic = "0.134"
oxc_span = "0.134"
oxc_diagnostics = "0.134"
# Safe self-referential storage for the arena-owned AST/Semantic (no hand-written unsafe).
self_cell = "1"
# Fast path interner map for the FileId hot path.
rustc-hash = "2"
# salsa intentionally NOT pinned: Oxc's arena artifacts are !Send/!Sync/!Update, so the
# incremental layer is hand-built behind GraphDb (see crates/graph/src/db.rs). A swap to
# salsa later is contained behind the facade. oxc_transformer/oxc_codegen are deferred to
# RT-003 (no speculative deps before the real type-strip lands).
# === /GRAPH-001 ===
# === RT-003 ===
# Position-preserving type-stripping (CANON §9, I-3) walks the stage-1 Oxc AST and
# blanks type-only spans to whitespace over the source string. This needs the Oxc
# AST visitor (traversal only); NO oxc_transformer / oxc_codegen — those transpile
# and emit fresh text, which loses byte positions and forces a sourcemap (forbidden
# by CANON §9). Span-blanking needs no codegen, so none are pinned. Consumed ONLY by
# crates/graph.
oxc_ast_visit = "0.134"
# === /RT-003 ===
# === RT-004 ===
# strict-web Stateless-Edge globals (CANON §8.1). Unmodified upstream Deno web
# extension crates, co-versioned with the `deno_core 0.403` pin above (they release
# in lockstep — these are the 0.403-matching set). Consumed ONLY by crates/runtime
# (the sole V8 edge, I-10). deno_url + deno_console were merged into deno_web at
# this generation, so URL/URLPattern/console live in deno_web. `deno_permissions`
# supplies the concrete `PermissionsContainer` deno_fetch reads from `OpState`;
# `hyper-util` supplies the `Name` type for the capability-gated DNS resolver
# (crates/runtime/src/web/perms.rs). No version literal diverges from deno_core.
deno_webidl = "0.250.0"
deno_web = "0.281.0"
deno_crypto = "0.264.0"
deno_fetch = "0.274.0"
# deno_fetch's client JS (`22_http_client.js`) lazy-loads deno_net's TLS polyfill,
# so the embedder must also register deno_net (co-versioned). Net ops are unused
# (fetch has its own hyper client); it is wired only so the JS graph resolves.
deno_net = "0.242.0"
deno_permissions = "0.109.0"
hyper-util = { version = "0.1", features = ["client-legacy"] }
# === /RT-004 ===
# === RT-006 ===
# Determinism harness (I-6): a seeded CSPRNG for reproducible Math.random /
# crypto entropy, and the OS entropy source for the --allow-random grant. All
# three are confined to crates/runtime/src/hermetic/state.rs (the one sanctioned
# host-seam home; principles-check P16 allowlists /hermetic/). Versions unify with
# the set already in the tree (no duplicate-version footprint cost, I-10).
rand_chacha = "0.9"
rand_core = "0.9"
getrandom = "0.3"
# === /RT-006 ===
